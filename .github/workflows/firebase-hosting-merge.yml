name: Deploy Flutter Web (WASM & JS) on Firebase Hosting

on:
  push:
    branches:
      - refactored_clean

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.32.4'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Decode base64 secrets
        run: echo "$SECRETS_FILE_CONTENTS" | base64 -d > lib/private.dart
        env:
          SECRETS_FILE_CONTENTS: ${{ secrets.Private_Dart_File }}

      - run: flutter pub get

      # Build JavaScript version
      - name: Build JS version
        run: flutter build web -o build/js

      # Build WASM version
      - name: Build WASM version
        run: flutter build web --wasm -o build/wasm

      # Create firebase.json with path-based rewrites
      - name: Create firebase.json
        run: |
          echo '{
            "hosting": {
              "public": "build",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [
                { "source": "/wasm/**", "destination": "/wasm/index.html" },
                { "source": "/js/**", "destination": "/js/index.html" }
              ]
            }
          }' > firebase.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TMDB55 }}'
          projectId: tmdb55
          channelId: live
